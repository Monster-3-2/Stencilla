name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Find and Run Gradle Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in the repository!"
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          "$GRADLEW_PATH" assembleDebug --project-dir "$GRADLE_DIR"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stencilla-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
