[versions]
agp                   = "8.7.3"
kotlin                = "2.1.0"
ksp                   = "2.1.0-1.0.29"
hilt                  = "2.52"
compose-bom           = "2024.12.01"
navigation            = "2.8.5"
room                  = "2.6.1"
datastore             = "1.1.1"
retrofit              = "2.11.0"
okhttp                = "4.12.0"
coil                  = "2.7.0"
play-services-location = "21.3.0"
lifecycle             = "2.8.7"
activity              = "1.9.3"
core-ktx              = "1.15.0"
kotlinx-serialization = "1.7.3"

[libraries]
# AndroidX
androidx-core-ktx                 = { group = "androidx.core",               name = "core-ktx",                          version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx    = { group = "androidx.lifecycle",           name = "lifecycle-runtime-ktx",             version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",       version.ref = "lifecycle" }
androidx-activity-compose         = { group = "androidx.activity",            name = "activity-compose",                  version.ref = "activity" }

# Compose
androidx-compose-bom              = { group = "androidx.compose",             name = "compose-bom",                       version.ref = "compose-bom" }
androidx-ui                       = { group = "androidx.compose.ui",          name = "ui" }
androidx-ui-graphics              = { group = "androidx.compose.ui",          name = "ui-graphics" }
androidx-ui-tooling-preview       = { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
androidx-ui-tooling               = { group = "androidx.compose.ui",          name = "ui-tooling" }
androidx-material3                = { group = "androidx.compose.material3",   name = "material3" }
androidx-material-icons-extended  = { group = "androidx.compose.material",    name = "material-icons-extended" }

# Navigation
androidx-navigation-compose       = { group = "androidx.navigation",          name = "navigation-compose",                version.ref = "navigation" }
androidx-hilt-navigation-compose  = { group = "androidx.hilt",                name = "hilt-navigation-compose",           version = "1.2.0" }

# Hilt
hilt-android                      = { group = "com.google.dagger",            name = "hilt-android",                      version.ref = "hilt" }
hilt-compiler                     = { group = "com.google.dagger",            name = "hilt-android-compiler",             version.ref = "hilt" }

# Room
androidx-room-runtime             = { group = "androidx.room",                name = "room-runtime",                      version.ref = "room" }
androidx-room-ktx                 = { group = "androidx.room",                name = "room-ktx",                          version.ref = "room" }
androidx-room-compiler            = { group = "androidx.room",                name = "room-compiler",                     version.ref = "room" }

# DataStore
androidx-datastore-preferences    = { group = "androidx.datastore",           name = "datastore-preferences",             version.ref = "datastore" }

# Networking
retrofit                          = { group = "com.squareup.retrofit2",       name = "retrofit",                          version.ref = "retrofit" }
retrofit-gson                     = { group = "com.squareup.retrofit2",       name = "converter-gson",                    version.ref = "retrofit" }
okhttp                            = { group = "com.squareup.okhttp3",         name = "okhttp",                            version.ref = "okhttp" }
okhttp-logging                    = { group = "com.squareup.okhttp3",         name = "logging-interceptor",               version.ref = "okhttp" }

# Serialization
kotlinx-serialization-json        = { group = "org.jetbrains.kotlinx",        name = "kotlinx-serialization-json",        version.ref = "kotlinx-serialization" }

# Coil
coil-compose                      = { group = "io.coil-kt",                   name = "coil-compose",                      version.ref = "coil" }

# Location
play-services-location            = { group = "com.google.android.gms",       name = "play-services-location",            version.ref = "play-services-location" }

[plugins]
android-application               = { id = "com.android.application",                             version.ref = "agp" }
kotlin-android                    = { id = "org.jetbrains.kotlin.android",                         version.ref = "kotlin" }
kotlin-compose                    = { id = "org.jetbrains.kotlin.plugin.compose",                  version.ref = "kotlin" }
hilt-android                      = { id = "com.google.dagger.hilt.android",                       version.ref = "hilt" }
ksp                               = { id = "com.google.devtools.ksp",                              version.ref = "ksp" }
kotlin-serialization              = { id = "org.jetbrains.kotlin.plugin.serialization",            version.ref = "kotlin" }
